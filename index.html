<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Landing Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>Modern Store</h1>
      <p>Discover stylish products with a clean shopping experience.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </header>

  <section id="products" class="products container">
    <h2>Featured Products</h2>
    <div class="grid">
      <article class="card"><h3>Wireless Headphones</h3><p>Premium sound and comfort.</p></article>
      <article class="card"><h3>Smart Watch</h3><p>Track your day with style.</p></article>
      <article class="card"><h3>Minimal Backpack</h3><p>Simple design for daily use.</p></article>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
